<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Don't Blink</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      object-fit: contain;
      pointer-events: none;
    }
    /* native Steuerelemente und Play-Overlay ausblenden (iOS/Android) */
    video::-webkit-media-controls,
    video::-webkit-media-controls-start-playback-button,
    video::-webkit-media-controls-overlay-play-button {
      display: none !important;
      -webkit-appearance: none;
    }
    #start {
      display: none;
      position: fixed;
      inset: 0;
      margin: auto;
      width: 160px;
      height: 60px;
      font-size: 1.2rem;
      background: #000;
      color: #fff;
      border: 1px solid #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <video id="v" src="dontblink.mp4"
         autoplay muted loop playsinline preload="auto"
         disablepictureinpicture disableremoteplayback
         controlslist="nodownload noremoteplayback"></video>
  <button id="start">Start</button>

  <script>
    const v = document.getElementById('v');
    const b = document.getElementById('start');

    function tryPlay() {
      v.play()
        .then(() => { b.style.display = 'none'; })
        .catch(() => { b.style.display = 'block'; });  // Autoplay blockiert → Knopf zeigen
    }

    b.addEventListener('click', tryPlay);
    v.addEventListener('pause', () => { if (!v.ended) tryPlay(); });
    document.addEventListener('contextmenu', e => e.preventDefault());

    tryPlay();
  </script>
</body>
